<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>AI 윤리 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 학습 지도(trail) — 3개의 핀을 따라 걷는 학생 화면, 조회 중심의 교사 화면 */
:root{
  --paper:#EDF2F7; --surface:#FFFFFF; --sunk:#E3EAF2; --ink:#1D2250; --ink-2:#4B5277; --ink-3:#7C83A3; --line:#D3DBE6;
  --l1:#3C47A6; --l2:#E2A512; --l3:#E1604C; --mint:#1E9E72; --mint-bg:#DDF4EA; --yellow-bg:#FDF1D2; --coral-bg:#FCE4DF; --indigo-bg:#E3E6F7;
  --red:#D2453A; --amber:#D99A0B; --green:#1E9E72;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(29,34,80,.06),0 6px 20px rgba(29,34,80,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11142A; --surface:#1A1E3B; --sunk:#151933; --ink:#E7EAF8; --ink-2:#AEB4D3; --ink-3:#7E85A8; --line:#2C3259;
  --l1:#8C96F0; --l2:#F2C04A; --l3:#F2826F; --mint:#4BCF9C; --mint-bg:#163A33; --yellow-bg:#3A3018; --coral-bg:#3E2320; --indigo-bg:#252B57;
  --red:#F07468; --amber:#F2C04A; --green:#4BCF9C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11142A; --surface:#1A1E3B; --sunk:#151933; --ink:#E7EAF8; --ink-2:#AEB4D3; --ink-3:#7E85A8; --line:#2C3259;
  --l1:#8C96F0; --l2:#F2C04A; --l3:#F2826F; --mint:#4BCF9C; --mint-bg:#163A33; --yellow-bg:#3A3018; --coral-bg:#3E2320; --indigo-bg:#252B57;
  --red:#F07468; --amber:#F2C04A; --green:#4BCF9C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,54px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:22px}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:14px} .tiny{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;letter-spacing:.08em;font-weight:600;color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
button{font:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;gap:8px;line-height:1.2;transition:transform .12s,opacity .12s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.go{background:var(--mint);color:#fff}
:focus-visible{outline:3px solid var(--l1);outline-offset:2px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--mint-bg);color:var(--mint)} .chip.warn{background:var(--yellow-bg);color:var(--amber)} .chip.bad{background:var(--coral-bg);color:var(--red)} .chip.info{background:var(--indigo-bg);color:var(--l1)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{display:block}
.vtag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--indigo-bg);color:var(--l1)}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:70vh}
.login .lead{font-size:18px;color:var(--ink-2);max-width:32em}
.login h1 em{font-style:normal;color:var(--l2)}
.rolebox{display:grid;gap:10px;margin-top:6px}
.gbtn{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),var(--shadow);padding:14px 22px;font-size:16px}
.gbtn .g{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--l1) 0 25%,var(--l3) 0 50%,var(--l2) 0 75%,var(--mint) 0);display:inline-block;position:relative}
.gbtn .g::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.trail-art{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px}
@media (max-width:820px){.login{grid-template-columns:1fr;min-height:0}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:18px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.modal header{padding:20px 22px 10px}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 22px;border:0;background:transparent;cursor:pointer;border-top:1px solid var(--line)}
.acct:hover{background:var(--sunk)}
.acct .meta{flex:1;min-width:0}
.acct .meta b{display:block;font-weight:600}
.acct .meta span{font-size:13px;color:var(--ink-3)}
.modal-body{overflow:auto}

/* pre quiz / quiz */
.qwrap{max-width:720px;margin:0 auto}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.qtext{font-size:21px;font-weight:600;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-size:16px;line-height:1.5}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sunk);color:var(--ink-2);font-family:var(--mono)}
.opt.sel{box-shadow:inset 0 0 0 2px var(--ink)} .opt.sel .k{background:var(--ink);color:var(--paper)}
.opt.right{box-shadow:inset 0 0 0 2px var(--green);background:var(--mint-bg)} .opt.right .k{background:var(--green);color:#fff}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--red);background:var(--coral-bg)}
.opt:disabled{cursor:default}
.note{border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.6}
.note b{display:block;margin-bottom:2px}
.note.hint{background:var(--yellow-bg)} .note.hint b{color:var(--amber)}
.note.exp{background:var(--indigo-bg)} .note.exp b{color:var(--l1)}
.note.bad{background:var(--coral-bg)} .note.bad b{color:var(--red)}
.note.good{background:var(--mint-bg)} .note.good b{color:var(--mint)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tries{display:flex;gap:5px;align-items:center}
.tries i{width:10px;height:10px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line)}
.tries i.on{background:var(--red);box-shadow:none}

/* level result */
.level-badge{font-family:var(--display);font-size:64px;width:120px;height:120px;border-radius:30px;display:grid;place-items:center;color:#fff;flex:none}
.lv-상{background:var(--l1)} .lv-중{background:var(--l2)} .lv-하{background:var(--l3)}
.startmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.startmap .cell{padding:14px;border-radius:12px;background:var(--sunk)}
.chbar{display:flex;gap:3px;margin-top:8px}
.chbar i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.chbar i.go{background:var(--ink)}
@media (max-width:600px){.startmap{grid-template-columns:1fr}}

/* hub */
.hubhead{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.trail{width:100%;height:auto;display:block}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.lcard{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.lcard .num{font-family:var(--display);font-size:15px;color:var(--lc)}
.lcard h3{font-size:24px}
.lcard .stripe{position:absolute;left:0;right:0;top:0;height:5px;background:var(--lc)}
.lcard.locked{opacity:.6}
.lcard .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
@media (max-width:820px){.lessons{grid-template-columns:1fr}}

/* lesson viewer */
.viewer{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px}
.toc ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.toc button{width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.toc button:hover{background:var(--sunk)}
.toc button.cur{background:var(--ink);color:var(--paper)}
.toc button .n{font-family:var(--mono);font-size:12px;width:20px;flex:none;opacity:.8}
.toc button.skip{opacity:.55}
.toc button.skip .n::after{content:"";}
.stage{min-width:0}
.slide{padding:clamp(20px,4vw,36px);min-height:420px;display:flex;flex-direction:column;gap:18px}
.slide h2{font-size:clamp(26px,4.2vw,36px)}
.kind{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--lc)}
.player{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;margin-top:12px}
.player .bar{flex:1;min-width:120px;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--lc)}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--line)}
.ibtn.main{background:var(--lc);color:#fff;width:46px;height:46px}
.ibtn svg{display:block}
@media (max-width:820px){.viewer{grid-template-columns:1fr}.toc{position:static}.toc ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

/* slide building blocks */
.lede{font-size:18px;line-height:1.7;max-width:38em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{border-radius:14px;padding:18px}
.panel.light{background:var(--yellow-bg)} .panel.dark{background:var(--ink);color:var(--paper)}
.panel.indigo{background:var(--indigo-bg)} .panel.mint{background:var(--mint-bg)} .panel.coral{background:var(--coral-bg)} .panel.sunk{background:var(--sunk)}
.panel h4{margin:0 0 6px;font-size:17px;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.65);color:#2a2f5a}
.panel.dark .tag{background:rgba(255,255,255,.12);color:inherit}
.qcard{border-radius:16px;padding:22px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--l2)}
.qcard .lbl{display:inline-block;background:var(--l2);color:#2a2000;font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px;margin-bottom:10px}
.qcard p{font-size:20px;font-weight:600;line-height:1.5}
.callout{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.6}
.callout mark{background:transparent;color:var(--l2);font-weight:700}
.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.use{padding:14px;border-radius:12px;background:var(--sunk)}
.use b{display:block;font-size:15px}
.use span{font-size:13.5px;color:var(--ink-2)}
@media (max-width:640px){.uses{grid-template-columns:1fr 1fr}}
/* phone scenario */
.phone{border-radius:26px;padding:10px;background:var(--ink);max-width:330px;width:100%;margin:0 auto}
.screen{border-radius:18px;background:linear-gradient(180deg,#cfe0f2,#e9f0f8);aspect-ratio:9/12;position:relative;overflow:hidden}
.screen .face{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:84px;height:100px}
.screen .scan{position:absolute;left:50%;top:26%;transform:translateX(-50%);width:120px;height:130px;border:2.5px solid #E1604C;border-radius:10px;animation:pulse 2s infinite}
.screen .info{position:absolute;left:50%;top:66%;transform:translateX(-50%);background:#fff;color:#1D2250;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.12)}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.screen .scan{animation:none}.shake{animation:none}}
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bubble{border-radius:18px;padding:18px;font-size:16.5px;line-height:1.6;position:relative}
.bubble .who2{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
.bubble.dev{background:var(--indigo-bg)} .bubble.dev .who2{color:var(--l1)}
.bubble.fr{background:var(--coral-bg)} .bubble.fr .who2{color:var(--red)}
@media (max-width:640px){.bubbles{grid-template-columns:1fr}}
/* traffic light */
.signal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lamp{background:var(--ink);border-radius:22px;padding:12px;display:grid;gap:10px}
.lamp i{width:46px;height:46px;border-radius:50%;display:block}
.lamp .r{background:#E5483C} .lamp .y{background:#F2B825} .lamp .g{background:#2DBE84}
.sig-items{display:grid;gap:10px}
.sig{border-radius:12px;padding:12px 14px;background:var(--sunk);border-left:5px solid}
.sig.r{border-color:#E5483C} .sig.y{border-color:#F2B825} .sig.g{border-color:#2DBE84}
.sig b{display:block;font-size:15px}
/* sorting activity */
.act{display:grid;gap:10px}
.act-item{border-radius:12px;padding:14px;background:var(--sunk);display:grid;gap:10px}
.act-item .stmt{font-weight:600}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:0;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:inline-flex;align-items:center;gap:6px}
.pick button .c{width:12px;height:12px;border-radius:50%}
.pick button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.fb{font-size:14px}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)}
/* funnel */
.gigo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.gigo .box{border-radius:14px;padding:16px 10px}
.gigo .arrow{font-size:26px;color:var(--ink-3)}
.blocks{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.blocks i{width:16px;height:16px;border-radius:4px}
@media (max-width:640px){.gigo{grid-template-columns:1fr}.gigo .arrow{transform:rotate(90deg)}}
/* video */
.video{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:stretch}
.vthumb{border-radius:16px;background:linear-gradient(135deg,var(--ink),#3a2f6b);color:#fff;aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:space-between;padding:16px;text-decoration:none;position:relative;overflow:hidden;max-width:100%}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .15s}
.vthumb:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.vthumb .play::after{content:"";border-left:20px solid #E1604C;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.vthumb .vt{font-family:var(--display);font-size:22px;line-height:1.25;position:relative}
.vthumb .src{font-size:12.5px;opacity:.8;position:relative}
@media (max-width:640px){.video{grid-template-columns:1fr}}
/* dataset */
.ds{border-radius:14px;padding:16px;background:var(--sunk);display:grid;gap:10px;text-align:left;border:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.ds:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.ds.on{box-shadow:inset 0 0 0 2px var(--ink)}
.stackbar{display:flex;height:16px;border-radius:6px;overflow:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* gears */
.gears{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gear{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.3;padding:8px;position:relative;cursor:pointer;border:0}
.gear .n{display:block;font-family:var(--mono);font-size:11px;opacity:.75}
.gear.a{background:var(--yellow-bg);box-shadow:inset 0 0 0 3px var(--l2)} .gear.b{background:var(--mint-bg);box-shadow:inset 0 0 0 3px var(--mint)} .gear.c{background:var(--coral-bg);box-shadow:inset 0 0 0 3px var(--l3)} .gear.d{background:var(--indigo-bg);box-shadow:inset 0 0 0 3px var(--l1)}
.gear.on{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:640px){.gears{grid-template-columns:repeat(3,1fr)}}
/* choice */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs .side{border:0;border-radius:16px;padding:20px;cursor:pointer;font-weight:700;font-size:17px;line-height:1.45;text-align:center}
.vs .side.a{background:var(--yellow-bg)} .vs .side.b{background:var(--coral-bg)}
.vs .side.on{box-shadow:inset 0 0 0 3px var(--ink)}
.vs .mid{font-family:var(--display);font-size:30px;color:var(--l3)}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .mid{text-align:center}}
.pledge label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sunk);cursor:pointer}
.pledge input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--mint)}
.summary-card{border-radius:14px;padding:16px 18px;background:var(--sunk);display:grid;gap:6px}
.summary-card .n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* certificate */
.cert{text-align:center;padding:clamp(28px,6vw,56px);display:grid;gap:16px;justify-items:center;position:relative;overflow:hidden}
.seal{width:110px;height:110px;border-radius:50%;background:var(--mint);display:grid;place-items:center;box-shadow:0 0 0 10px var(--mint-bg)}

/* teacher */
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:16px 18px}
.kpi .v{font-family:var(--display);font-size:40px;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:600}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr.sel td{background:var(--indigo-bg)}
.sheet td,.sheet th{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line)}
.sheet th{background:var(--sunk);color:var(--ink-2)}
.sheet tbody tr{cursor:default}
.lmini{display:flex;gap:4px}
.lmini i{width:26px;height:8px;border-radius:3px;background:var(--line);display:block}
.lmini i.d{background:var(--mint)} .lmini i.p{background:var(--l2)}
.detail{padding:20px;display:grid;gap:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.dl dt{color:var(--ink-3)} .dl dd{margin:0;font-weight:600}
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.dist{display:grid;gap:10px}
.dist .r{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.dist .track{height:14px;border-radius:5px;background:var(--sunk);overflow:hidden}
.dist .track i{display:block;height:100%;border-radius:5px}
.rules{display:grid;gap:8px;font-size:14px}
.rules div{display:flex;gap:10px}
.rules b{min-width:118px;color:var(--ink-3);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.detail td,.detail th{padding:8px 6px}
select{font-size:14px;padding:7px 10px}
.banner{font-size:13px;padding:10px 14px;border-radius:12px;background:var(--sunk);color:var(--ink-2)}

/* ---- V2 additions ---- */
#busy{position:fixed;left:0;right:0;top:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--l2),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
.center-note{max-width:560px;margin:8vh auto 0}
.avatar.staff{background:var(--yellow-bg);color:var(--amber)}
.toc button.locked{opacity:.45;cursor:not-allowed}
.toc button.locked:hover{background:transparent}
.toc button .n svg{vertical-align:-1px}
.timer{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2);min-width:64px;justify-content:center}
.timer.wait{background:var(--yellow-bg);color:var(--amber)}
.timer.ok{background:var(--mint-bg);color:var(--mint)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.vframe{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fld{display:grid;gap:5px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.fld input,.fld select{font-weight:400;font-size:15px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
@media (max-width:640px){.setgrid{grid-template-columns:1fr}}
.btn.danger{color:var(--red)}
.btn.bg-danger{background:var(--red);color:#fff}
.toast.bad{background:var(--red);color:#fff;max-width:min(92vw,560px);text-align:center;border-radius:14px}

.checkcard{margin-top:12px;padding:18px 20px;display:grid;gap:12px;box-shadow:inset 0 0 0 2px var(--lc),var(--shadow)}
.checkcard.done{box-shadow:inset 0 0 0 2px var(--mint),var(--shadow)}
.ck-label{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--lc)}
.checkcard.done .ck-label{color:var(--mint)}
.ck-q{font-size:17px;font-weight:600;line-height:1.5}
.ck-opts{display:grid;gap:8px}
.ck-opts .opt{padding:10px 14px;font-size:15px}
.timer.need{background:var(--coral-bg);color:var(--red);font-family:var(--body);font-weight:600;font-size:12.5px}
.avatar.big{width:64px;height:64px;font-size:20px;flex:none}
.confirm h2{font-size:30px}
.vframe #ytHost, .vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ck-item{display:grid;gap:8px}
.ck-item + .ck-item{border-top:1px dashed var(--line);padding-top:12px}
.vwatch .progress{display:block}
</style>
</head>
